[project]
name = "collimator"
version = "0.1.0"
description = "Компилятор конвейеров документов в Dynamic Workflows для Claude Code"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collimator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tools/ is not a package: the gate is a standalone script called by a workflow stage,
# so tests import it by name rather than through collimator.
pythonpath = [".", "tools"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
