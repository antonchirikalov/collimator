name: article_fact_checker
version: 1
description: >
  Corrects an article's sourced claims against the notes it was written from and returns the
  same article. Not a reviewer: it fixes names, years, corpora, model configurations, quoted
  code and overclaims in place, so a critic never spends a round on them. Adapted from
  requirements_fact_checker for articles, because in an explainer the claim that gets caught
  is an attribution, not a requirement.
consumes:
  - { port: draft, type: article@v1 }
  # the per-source notes, not the analysis: the analysis is already a reading of them, and a
  # claim has to be checked against what a source actually says
  - { port: notes, type: collection<study_note@v1> }
  - { port: brief, type: brief@v1 }
produces:
  - { port: article, type: article@v1 }
needs: [read, edit]
defaults:
  timeout_s: 3600
